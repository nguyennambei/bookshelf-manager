<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Cá Nhân</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="dashboard-wrapper">
        <header class="main-header" id="user-header" style="display: none;">
            <div class="user-profile">
                <div class="avatar">👤</div>
                <span id="display-name">Người dùng</span>
            </div>
            <button id="logout-btn" class="logout-link">Đăng xuất</button>
        </header>

        <main class="content">
            <section id="auth-box" class="auth-card">
                <h2>Xin chào!</h2>
                <p>Vui lòng đăng nhập để quản lý ứng dụng</p>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email của bạn">
                    <input type="password" id="password" placeholder="Mật khẩu">
                </div>
                <button id="login-btn" class="btn-primary">Đăng Nhập</button>
            </section>

            <section id="app-box" class="app-grid" style="display: none;">
                <a href="money/index.html" class="app-item">
                    <div class="app-icon" style="background: #e3f2fd;">💰</div>
                    <div class="app-info">
                        <h3>Sổ Thu Chi</h3>
                        <p>Quản lý dòng tiền cá nhân</p>
                    </div>
                </a>

                <a href="manga/index.html" class="app-item">
                    <div class="app-icon" style="background: #f3e5f5;">📚</div>
                    <div class="app-info">
                        <h3>Manga Shelf</h3>
                        <p>Bộ sưu tập truyện tranh</p>
                    </div>
                </a>
            </section>
        </main>
    </div>

    <script type="module" src="js/auth-dashboard.js"></script>
</body>

</html>
