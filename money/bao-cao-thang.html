<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <script src="js/auth-gate.js"></script>
    <title>Báo Cáo Tài Chính Tháng</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/report.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>
    <header class="app-header">
        <h1>SỔ THU CHI CỔ ĐIỂN</h1>
        <nav class="app-navigation">
            <a href="index.html" class="nav-link">Nhật Ký Giao Dịch</a>
            <a href="so-du-tai-khoan.html" class="nav-link">Số Dư Hiện Tại</a>
            <a href="bao-cao-thang.html" class="nav-link active">Báo Cáo Tháng</a>
            <a href="setting/cai-dat-tai-khoan.html" class="nav-link">Cài Đặt Tài Khoản</a>
            <a href="setting/cai-dat-the-loai.html" class="nav-link">Cài Đặt Thể Loại</a>
        </nav>
    </header>
    <div class="container" id="report-content" style="max-width: 1000px; margin: 0 auto; padding: 20px;">
        <h2 style="margin: 20px 0;">Báo Cáo Tài Chính</h2>

        <div class="report-card">
            <div>
                <label>Chọn tháng báo cáo:</label>
                <input type="month" id="report-month" class="form-select" style="width: 200px;">
            </div>
            <button onclick="exportToPDF()" class="btn-submit" style="background: #e74c3c;">Tải xuống Báo cáo
                (PDF)</button>
        </div>

        <div class="stat-grid">
            <div class="stat-item bg-income">Tổng thu: <div id="total-income"
                    style="font-size: 20px; font-weight: bold;">0 ₫</div>
            </div>
            <div class="stat-item bg-expense">Tổng chi: <div id="total-expense"
                    style="font-size: 20px; font-weight: bold;">0 ₫</div>
            </div>
            <div class="stat-item bg-balance">Số dư: <div id="net-balance" style="font-size: 20px; font-weight: bold;">0
                    ₫</div>
            </div>
        </div>

        <div class="report-card">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 30px;">
                <div>
                    <legend>Biểu đồ Thu nhập (Trend)</legend>
                    <canvas id="incomeChart"></canvas>
                </div>
                <div>
                    <legend>Biểu đồ Chi tiêu (Daily)</legend>
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <div class="report-card">
            <legend>Phân tích theo Danh Mục</legend>
            <table class="classic-table">
                <thead>
                    <tr>
                        <th>Danh mục</th>
                        <th style="text-align: right;">Số tiền</th>
                    </tr>
                </thead>
                <tbody id="report-category-body"></tbody>
            </table>
        </div>
    </div>
    <script src="js/bao-cao-thang.js"></script>
</body>

</html>
