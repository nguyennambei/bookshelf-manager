<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài Đặt Tài Khoản</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>

    <header class="app-header">
        <h1>CẤU HÌNH TÀI KHOẢN</h1>
        <nav class="app-navigation">
            <a href="../index.html" class="nav-link">Sổ Cái Giao Dịch</a>
            <a href="so-du-tai-khoan.html" class="nav-link">Số Dư Hiện Tại</a>
            <a href="bao-cao-thang.html" class="nav-link">Báo Cáo Tháng</a>
            <a href="cai-dat-tai-khoan.html" class="nav-link active">Cài Đặt Tài Khoản</a>
            <a href="cai-dat-the-loai.html" class="nav-link">Cài Đặt Thể Loại</a>
        </nav>
    </header>

    <main class="box_wrap">
        <div class="flex-container">
            <div class="flex-col-form">
                <fieldset>
                    <legend id="account-form-title">Thêm Tài Khoản Mới</legend>
                    <form id="form-account" onsubmit="return false;">
                        <input type="hidden" id="edit-acc-id" value="">
                        <div class="form-group">
                            <label>Phân loại nhóm:</label>
                            <select id="input-acc-type">
                                <option value="cash">Tiền mặt (Ví cá nhân)</option>
                                <option value="bank">Tài khoản Ngân hàng (VCB, TCB...)</option>
                                <option value="credit">Thẻ tín dụng (HSBC, UOB...)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tên định danh tài khoản:</label>
                            <input type="text" id="input-acc-name" required>
                        </div>
                        <div class="form-group">
                            <label>Số dư / Hạn mức gốc:</label>
                            <input type="number" id="input-acc-balance" required>
                        </div>
                        <button type="submit" id="btn-acc-submit" class="btn-submit">Lưu Tài Khoản</button>
                        <button type="button" id="btn-acc-cancel" class="btn-submit btn-secondary" style="display:none; margin-top:5px;">Hủy Sửa</button>
                    </form>
                </fieldset>
            </div>

            <div class="flex-col-data">
                <fieldset>
                    <legend>Danh Sách Tài Khoản Hiện Tại</legend>
                    <div class="table-responsive">
                        <table class="classic-table">
                            <thead>
                                <tr>
                                    <th>Tên tài khoản</th>
                                    <th>Loại</th>
                                    <th class="text-right">Số dư gốc</th>
                                    <th class="text-center" style="width: 120px;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="table-account-body"></tbody>
                        </table>
                    </div>
                </fieldset>
            </div>
        </div>
    </main>

    <script src="../js/account.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => { initAccountLogic(); });
    </script>
</body>
</html>
