<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>My Personal Dashboard</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; margin: 0; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card { background: white; padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); transition: 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .card h2 { color: #2c3e50; }
        .card p { color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="card" onclick="window.location.href='money/index.html'">
            <h2>💰 Sổ Thu Chi</h2>
            <p>Quản lý chi tiêu, số dư và báo cáo</p>
        </div>

        <div class="card" onclick="window.location.href='manga/index.html'">
            <h2>📚 MangaShelf Manager</h2>
            <p>Quản lý tủ truyện và tiến độ đọc</p>
        </div>
    </div>

</body>
</html>
